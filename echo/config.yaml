name: Echo
version: "1.0.0"
slug: echo
description: Sistema de arrastre para oposiciones con repaso espaciado, calendario y señales.
url: https://github.com/stugemusa/echo
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Interfaz web de Echo
webui: http://[HOST]:[PORT:3000]
watchdog: http://[HOST]:[PORT:3000]/api/health
options:
  app_pin: "1234"
schema:
  app_pin: password
  api_token: password?
  session_secret: password?
  exam_date: str?
